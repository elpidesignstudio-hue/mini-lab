<style>
  :root{
    --bg:#ffffff;
    --card:#ffffff;
    --ink:#1c1d22;
    --muted:#75757e;
    --line:rgba(28,29,34,0.09);
    --line-strong:rgba(28,29,34,0.14);
    --accent:#ff6a48;
    --accent-ink:#c8431f;
    --accent-soft:#ffe7dd;
    --accent-soft-2:#fff1ea;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:64px 24px;
    background:var(--bg);
    font-family:'Sora', ui-sans-serif, system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
  }

  .caption{
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
    letter-spacing:0.02em;
    max-width:320px;
    line-height:1.7;
  }
  .caption b{ color:var(--accent-ink); font-weight:600; }

  .scene{
    perspective:1500px;
    width:340px;
    height:460px;
  }

  .tilt{
    width:100%;
    height:100%;
    position:relative;
    transform:perspective(1500px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    transition:transform 0.12s ease-out;
    cursor:pointer;
    outline:none;
  }
  .tilt.idle{
    transition:transform 0.65s cubic-bezier(.22,1,.36,1);
  }
  .tilt:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:10px;
    border-radius:24px;
  }

  .flipper{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
    transition:transform 0.75s cubic-bezier(.5,.15,.15,1);
    transform:rotateY(0deg);
  }
  .flipper.flipped{ transform:rotateY(180deg); }

  .face{
    position:absolute;
    inset:0;
    border-radius:22px;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    padding:34px 30px;
    display:flex;
    flex-direction:column;
    background:var(--card);
    border:1px solid var(--line-strong);
    box-shadow:
      0 26px 54px -26px rgba(28,29,34,0.28),
      0 2px 0 rgba(28,29,34,0.02) inset;
    overflow:hidden;
  }
  .face.back{ transform:rotateY(180deg); }

  .face::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(320px 260px at var(--mx,50%) var(--my,-10%), var(--accent-soft-2), transparent 62%);
    opacity:0.9;
    pointer-events:none;
  }

  /* ---------- front ---------- */

  .portrait{
    position:relative;
    width:172px;
    height:172px;
    margin:0 auto 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1;
  }
  .blob{
    position:absolute;
    inset:-14px;
    width:calc(100% + 28px);
    height:calc(100% + 28px);
    z-index:0;
  }
  .character{
    position:relative;
    z-index:1;
    width:142px;
    height:auto;
    color:var(--ink);
  }

  .identity{
    text-align:center;
    flex:1;
    position:relative;
    z-index:1;
  }
  .name{
    font-family:'Bricolage Grotesque', ui-sans-serif, sans-serif;
    font-weight:700;
    font-size:27px;
    letter-spacing:-0.01em;
    margin:0 0 10px;
    color:var(--ink);
    text-wrap:balance;
  }
  .role{
    display:inline-flex;
    margin:0;
    padding:6px 14px;
    border-radius:999px;
    background:var(--accent-soft);
    color:var(--accent-ink);
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.01em;
  }

  .hint{
    position:relative;
    z-index:1;
    margin-top:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    color:var(--muted);
    font-size:10.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    pointer-events:none;
    opacity:0.85;
  }
  .hint svg{ width:13px; height:13px; animation:swirl 3.2s ease-in-out infinite; }
  @keyframes swirl{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(180deg); }
  }

  /* ---------- back ---------- */

  .intro{
    position:relative;
    z-index:1;
    font-family:'Bricolage Grotesque', ui-sans-serif, sans-serif;
    font-weight:600;
    font-size:16px;
    line-height:1.6;
    color:var(--ink);
    margin:2px 0 18px;
    text-wrap:balance;
  }

  .rule{
    position:relative;
    z-index:1;
    height:1px;
    background:var(--line);
    margin:0 0 18px;
  }

  .contacts{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    gap:13px;
    margin-bottom:18px;
  }
  .contact-row{
    display:flex;
    align-items:center;
    gap:11px;
    color:var(--ink);
    text-decoration:none;
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:12.5px;
    letter-spacing:0.01em;
    border-radius:8px;
    padding:2px 4px;
    margin:-2px -4px;
    transition:color 0.15s ease, background 0.15s ease;
  }
  .contact-row:hover{ color:var(--accent-ink); background:var(--accent-soft-2); }
  .contact-row svg{ width:15px; height:15px; flex:none; color:var(--accent); }

  .socials{
    position:relative;
    z-index:1;
    margin-top:auto;
    display:flex;
    gap:10px;
    justify-content:center;
  }
  .social{
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--line-strong);
    color:var(--muted);
    text-decoration:none;
    transition:color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
  }
  .social svg{ width:16px; height:16px; }
  .social:hover{
    color:var(--accent-ink);
    border-color:var(--accent);
    box-shadow:0 0 0 5px var(--accent-soft);
    transform:translateY(-2px);
  }

  @media (prefers-reduced-motion:reduce){
    .tilt, .tilt.idle, .flipper{ transition:none !important; }
    .hint svg{ animation:none; }
  }
</style>

<script>
(function(){
  var scene = document.getElementById('scene');
  var tilt = document.getElementById('tilt');
  var flipper = document.getElementById('flipper');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var maxTilt = 14;
  var flipped = false;

  function setTilt(px, py){
    var rx = (py - 0.5) * -maxTilt;
    var ry = (px - 0.5) * maxTilt;
    tilt.style.setProperty('--rx', rx.toFixed(2) + 'deg');
    tilt.style.setProperty('--ry', ry.toFixed(2) + 'deg');
    tilt.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
    tilt.style.setProperty('--my', (py * 100).toFixed(1) + '%');
  }

  function resetTilt(){
    tilt.classList.add('idle');
    tilt.style.setProperty('--rx', '0deg');
    tilt.style.setProperty('--ry', '0deg');
    tilt.style.setProperty('--mx', '50%');
    tilt.style.setProperty('--my', '-10%');
  }

  if (!reduceMotion){
    tilt.addEventListener('pointerenter', function(){
      tilt.classList.remove('idle');
    });

    tilt.addEventListener('pointermove', function(e){
      var rect = tilt.getBoundingClientRect();
      var px = (e.clientX - rect.left) / rect.width;
      var py = (e.clientY - rect.top) / rect.height;
      setTilt(px, py);
    });

    tilt.addEventListener('pointerleave', resetTilt);
    resetTilt();
  }

  function toggleFlip(){
    flipped = !flipped;
    flipper.classList.toggle('flipped', flipped);
    tilt.setAttribute('aria-pressed', String(flipped));
  }

  tilt.addEventListener('click', function(e){
    if (e.target.closest('a')) return;
    toggleFlip();
  });

  tilt.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      toggleFlip();
    }
  });
})();
</script>
